services:
  knowledge-db:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: knowledge_agent
      POSTGRES_USER: knowledge_app
      POSTGRES_PASSWORD: knowledge_app_local_only
    ports:
      - "5433:5432"
    volumes:
      - knowledge-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_app -d knowledge_agent"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  knowledge-db-data:
