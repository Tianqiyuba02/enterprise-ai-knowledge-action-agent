name: Deterministic CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  postgresql:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_DB: knowledge_agent
          POSTGRES_USER: knowledge_app
          POSTGRES_PASSWORD: knowledge_app_local_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U knowledge_app -d knowledge_agent"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      RUN_POSTGRES_TESTS: "1"
      KNOWLEDGE_DATABASE_URL: postgresql+psycopg://knowledge_app:knowledge_app_local_only@127.0.0.1:5433/knowledge_agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run pytest tests/integration

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
